title: Grocery Store SKU Labeling
type: community
group: Community Contributions
details: <h1>Grocery Store SKU Labeling</h1><p>Bounding boxes + Taxonomy SKU search over the Trader Joe's product catalog.</p>
config: |
  <View style="display: flex; align-items: flex-start; gap: 16px;">
    <View style="flex: 0 0 45%;">
      <Image name="image" value="$image" zoom="true" zoomControl="true" scrollZoom="true"/>
    </View>
  
    <View style="flex: 1 1 auto; min-width: 0; position: sticky; top: 0;">
      <RectangleLabels name="bbox" toName="image">
        <Label value="Product" background="#0070f3" selected="true"/>
      </RectangleLabels>
      <Header value="SKU" />
      <Taxonomy name="sku" toName="image" perRegion="true" required="true" listMode="true" maxUsages="1" placeholder="Search SKU...">
