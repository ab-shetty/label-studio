name: Build and publish Docker image (GHCR)

# Perceive / Trader Joe's project workflow: builds this fork's full production
# image (frontend + backend, see root Dockerfile) and pushes it to GHCR so
# teammates can `docker pull` a ready-to-run image with the custom UI
# (TaxonomyList / listMode SKU search) instead of building from source
# locally -- the frontend build is heavy (node/yarn monorepo) and doing it
# once here, not on every teammate's machine, is the whole point.
#
# Deliberately a minimal, from-scratch workflow rather than reusing upstream's
# docker-build.yml: that one needs DockerHub org secrets, a LaunchDarkly SDK
# key, and Slack webhook secrets we don't have. This one only needs the
# built-in GITHUB_TOKEN (already scoped for GHCR via the permissions below).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
